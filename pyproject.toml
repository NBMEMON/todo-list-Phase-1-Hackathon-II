[project]
name = "todo-list-app"
version = "0.1.0"
description = "Todo List Application with intelligent features"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-dateutil>=2.8.0",
]

[project.scripts]
todo = "src.main:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
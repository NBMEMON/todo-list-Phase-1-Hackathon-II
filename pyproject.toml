[project]
name = "todo-list-app"
version = "0.1.0"
description = "Todo List Application with intelligent features"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-dateutil>=2.8.0",
]

[project.scripts]
todo = "src.main:main_entry"
add = "src.main:add_cmd"
delete = "src.main:delete_cmd"
view = "src.main:view_cmd"
list = "src.main:list_cmd"
search = "src.main:search_cmd"
update = "src.main:update_cmd"
done = "src.main:done_cmd"
undone = "src.main:undone_cmd"

[tool.setuptools.packages.find]
include = ["src*", "console_scripts*"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"